<mat-card class="chat-card">
  <mat-card-header>
    <mat-card-title [id]="titleId">Chat</mat-card-title>
    <mat-card-subtitle
      >Newest first
      @if (chatModeLabel(); as label) {
        <span class="chat-mode-label">· {{ label }}</span>
      }
    </mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <div class="chat-scroll" tabindex="0" role="region" [attr.aria-labelledby]="titleId">
      @for (msg of displayedMessages(); track $index) {
        <div
          class="chat-message"
          [class.white-msg]="msg.senderColor === 'WHITE'"
          [class.black-msg]="msg.senderColor === 'BLACK'"
        >
          <div class="msg-header">
            <span
              class="sender"
              [class.white-sender]="msg.senderColor === 'WHITE'"
              [class.black-sender]="msg.senderColor === 'BLACK'"
            >
              {{ getPlayerName(msg) }}
            </span>
            @let index = moveIndex(msg);
            @if (index !== undefined) {
              <button
                type="button"
                class="msg-time msg-move"
                [attr.aria-label]="moveLabel(msg)"
                (click)="moveSelected.emit(index)"
              >
                move {{ msg.moveNumber }}
              </button>
            } @else {
              <span class="msg-time">move {{ msg.moveNumber }}</span>
            }
          </div>
          <div class="msg-body">{{ msg.message }}</div>
        </div>
      } @empty {
        <div class="empty-chat">{{ emptyText() }}</div>
      }
    </div>
  </mat-card-content>
</mat-card>
