<mat-toolbar class="app-toolbar">
  <a class="brand" routerLink="/tournaments">
    <svg class="brand-logo" viewBox="5 3 36 42" aria-hidden="true" focusable="false">
      <path
        class="brand-logo-knight"
        d="M14 38C14.5 33 17 30 20.5 27 18 25.5 15 26 12.5 26.5 10 27 7.5 26 7 24c-.5-1.5.5-3 1.5-4.5L15 11.5 16.5 5l4 4C27 7.5 35 12.5 36.5 22 37.5 29 36 34 35 38Z"
      />
      <rect class="brand-logo-knight" x="11" y="40.5" width="27" height="3.5" rx="1.2" />
      <path class="brand-logo-trace" d="M24.5 11.6v3.9l4 4h6.1M21.5 29H27l3.5-3.5h5.9" />
      <circle class="brand-logo-detail" cx="24.5" cy="11.6" r="1.7" />
      <circle class="brand-logo-detail" cx="21.5" cy="29" r="1.7" />
      <circle class="brand-logo-detail" cx="15.2" cy="15.6" r="1.6" />
      <circle class="brand-logo-node" cx="36.8" cy="19.5" r="2.2" />
      <circle class="brand-logo-node" cx="36.8" cy="25.5" r="2.2" />
    </svg>
    <span class="toolbar-title">AI Chess Arena</span>
  </a>
  <app-live-games-switcher />
  <div class="toolbar-actions">
    <button
      mat-icon-button
      class="theme-toggle"
      (click)="toggleTheme()"
      [attr.aria-label]="darkMode() ? 'Switch to light mode' : 'Switch to dark mode'"
    >
      <mat-icon>{{ darkMode() ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>
    <button mat-button class="toolbar-link" routerLink="/practice">
      <mat-icon>sports_esports</mat-icon>
      <span>Practice</span>
    </button>
    <button mat-button class="toolbar-link" routerLink="/benchmarks">
      <span>Benchmarks</span>
    </button>
    <button mat-button class="toolbar-link" routerLink="/analytics">
      <mat-icon>insights</mat-icon>
      <span>Analytics</span>
    </button>
    <button mat-button class="toolbar-link" routerLink="/leaderboard">
      <mat-icon>leaderboard</mat-icon>
      <span>Leaderboard</span>
    </button>
    <button mat-button class="toolbar-link" routerLink="/system">
      <mat-icon>monitor_heart</mat-icon>
      <span>System</span>
    </button>
    <button mat-stroked-button class="toolbar-cta" routerLink="/tournaments/new">
      <mat-icon>add_circle</mat-icon>
      <span>New Tournament</span>
    </button>
  </div>
</mat-toolbar>

<div class="app-content">
  <router-outlet />
</div>
