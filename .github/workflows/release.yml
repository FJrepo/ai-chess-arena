name: Release

# Release flow:
#   1. validate the tag (exact vX.Y.Z, commit reachable from main, changelog entry exists)
#   2. run the full CI suite on the tagged commit
#   3. build amd64 + arm64 indexes and push them only under a sha-<12> candidate tag
#   4. check both platforms, smoke-test the amd64 stack and run arm64 Stockfish under QEMU
#   5. promote both full candidate indexes to vX.Y.Z and latest, then publish the GitHub Release
# A failure before step 5 leaves every user-facing tag (vX.Y.Z, latest) untouched.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate Release Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
      namespace: ${{ steps.vars.outputs.namespace }}
      backend_image: ${{ steps.vars.outputs.backend_image }}
      frontend_image: ${{ steps.vars.outputs.frontend_image }}
      candidate_tag: ${{ steps.vars.outputs.candidate_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require vX.Y.Z tag on a commit from main
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must match vX.Y.Z exactly (got '$VERSION')."
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tagged commit $GITHUB_SHA is not reachable from main."
            exit 1
          fi

      - name: Validate changelog entry
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          if ! python3 scripts/release_notes.py "$VERSION" CHANGELOG.md --repository "$GITHUB_REPOSITORY" > /dev/null; then
            echo "::error::CHANGELOG.md must contain a release section for $VERSION."
            exit 1
          fi

      - name: Derive image names
        id: vars
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ github.ref_name }}
        run: |
          owner_lc="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          {
            echo "version=$VERSION"
            echo "namespace=$owner_lc"
            echo "backend_image=ghcr.io/${owner_lc}/chess-backend"
            echo "frontend_image=ghcr.io/${owner_lc}/chess-frontend"
            echo "candidate_tag=sha-${GITHUB_SHA::12}"
          } >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: validate-tag
    uses: ./.github/workflows/ci.yml
    # A called workflow may not request more than its caller grants; ci.yml's secret-scan job asks for these.
    permissions:
      contents: read
      pull-requests: read

  build-candidates:
    name: Build ${{ matrix.component }} Candidate
    runs-on: ubuntu-latest
    needs:
      - validate-tag
      - ci
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        component: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ needs.validate-tag.outputs.namespace }}/chess-${{ matrix.component }}
          tags: |
            type=raw,value=${{ needs.validate-tag.outputs.candidate_tag }}
          # Repository metadata only covers MIT; the backend also bundles GPL Stockfish.
          labels: |
            ${{ matrix.component == 'backend' && 'org.opencontainers.image.licenses=MIT, GPL-3.0-or-later' || '' }}

      - name: Build and push candidate image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=image,oci-mediatypes=true
          cache-from: type=gha,scope=release-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.component }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  smoke-test:
    name: Smoke Test Candidates
    runs-on: ubuntu-latest
    needs:
      - validate-tag
      - build-candidates
    permissions:
      contents: read
      packages: read
    outputs:
      backend_digest: ${{ steps.digests.outputs.backend_digest }}
      frontend_digest: ${{ steps.digests.outputs.frontend_digest }}
    env:
      DOCKER_DEFAULT_PLATFORM: linux/amd64
      # Not the default 4200: changing FRONTEND_PORT is the documented fix for a port conflict, and the
      # same-origin check below must hold on any published port, not only on an allow-listed one.
      FRONTEND_PORT: '4317'
      BACKEND_REF: ${{ needs.validate-tag.outputs.backend_image }}:${{ needs.validate-tag.outputs.candidate_tag }}
      FRONTEND_REF: ${{ needs.validate-tag.outputs.frontend_image }}:${{ needs.validate-tag.outputs.candidate_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve candidate digests
        id: digests
        run: |
          backend_digest="$(docker buildx imagetools inspect "$BACKEND_REF" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          frontend_digest="$(docker buildx imagetools inspect "$FRONTEND_REF" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          for d in "$backend_digest" "$frontend_digest"; do
            [[ "$d" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Could not resolve candidate digest ($d)"; exit 1; }
          done
          echo "backend_digest=$backend_digest" >> "$GITHUB_OUTPUT"
          echo "frontend_digest=$frontend_digest" >> "$GITHUB_OUTPUT"

      - name: Verify candidate platforms
        env:
          BACKEND_PINNED: ${{ needs.validate-tag.outputs.backend_image }}@${{ steps.digests.outputs.backend_digest }}
          FRONTEND_PINNED: ${{ needs.validate-tag.outputs.frontend_image }}@${{ steps.digests.outputs.frontend_digest }}
        run: |
          for image in "$BACKEND_PINNED" "$FRONTEND_PINNED"; do
            docker buildx imagetools inspect "$image"
            # Ignore provenance attestations (unknown/unknown), but require both runnable platforms.
            docker buildx imagetools inspect "$image" --raw | jq -e '
              .mediaType == "application/vnd.oci.image.index.v1+json" and
              ([.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"])
            '
          done

      - name: Verify Stockfish license files and labels
        env:
          BACKEND_PINNED: ${{ needs.validate-tag.outputs.backend_image }}@${{ steps.digests.outputs.backend_digest }}
        run: |
          for arch in amd64 arm64; do
            # Inspect each child by digest so the daemon cannot return the other platform's labels.
            manifest_digest="$(docker buildx imagetools inspect "$BACKEND_PINNED" --raw | jq -er --arg arch "$arch" '
              .manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest
            ')"
            platform_ref="${BACKEND_PINNED%@*}@$manifest_digest"
            docker pull --platform "linux/$arch" "$platform_ref"
            docker run --rm --platform "linux/$arch" --entrypoint sh "$platform_ref" -c \
              'test -f /usr/share/licenses/stockfish/COPYING.txt && test -f /usr/share/licenses/stockfish/NOTICE.txt'
            stockfish_version="$(docker inspect "$platform_ref" --format '{{ index .Config.Labels "dev.aichessarena.stockfish.version" }}')"
            stockfish_source="$(docker inspect "$platform_ref" --format '{{ index .Config.Labels "dev.aichessarena.stockfish.source" }}')"
            image_licenses="$(docker inspect "$platform_ref" --format '{{ index .Config.Labels "org.opencontainers.image.licenses" }}')"
            test "$stockfish_version" = 'sf_19'
            test "$stockfish_source" = 'https://github.com/official-stockfish/Stockfish/tree/sf_19'
            test "$image_licenses" = 'MIT, GPL-3.0-or-later'
          done

      - name: Check arm64 Stockfish UCI under emulation
        env:
          BACKEND_PINNED: ${{ needs.validate-tag.outputs.backend_image }}@${{ steps.digests.outputs.backend_digest }}
        run: |
          stockfish_output="$(printf 'uci\nquit\n' | timeout 60s docker run --rm -i --platform linux/arm64 \
            --network none --entrypoint /usr/local/bin/stockfish "$BACKEND_PINNED")"
          printf '%s\n' "$stockfish_output"
          grep -Eq '^id name Stockfish 19([[:space:]]|$)' <<< "$stockfish_output"
          grep -qx 'uciok' <<< "$stockfish_output"

      - name: Start released-image stack from candidates
        env:
          IMAGE_NAMESPACE: ${{ needs.validate-tag.outputs.namespace }}
          IMAGE_TAG: ${{ needs.validate-tag.outputs.candidate_tag }}
          OPENROUTER_API_KEY: smoke-test-placeholder
        run: |
          DB_PASSWORD="$(openssl rand -hex 24)"
          export DB_PASSWORD
          docker compose -f docker-compose.prod.yml up -d --wait --wait-timeout 300

      - name: Check frontend and proxied API
        run: |
          curl -fsS -o /dev/null "http://127.0.0.1:${FRONTEND_PORT:-4200}/"
          curl -fsS "http://127.0.0.1:${FRONTEND_PORT:-4200}/api/tournaments" | head -c 200
          echo

      - name: Check same-origin writes and WebSocket through the frontend proxy
        # Browsers send Origin on every POST and WebSocket handshake. The frontend's own address is not on
        # quarkus.http.cors.origins, so these only pass if nginx forwards Host with its port and the backend
        # sees the request as same-origin. A 403 here means every create/start/move in the UI would fail.
        run: |
          base="http://127.0.0.1:${FRONTEND_PORT:-4200}"
          # An empty body is rejected by validation (400) without changing anything.
          status="$(curl -sS -o /tmp/post-body.txt -w '%{http_code}' -X POST \
            -H "Origin: $base" -H 'Content-Type: application/json' --data '{}' "$base/api/tournaments")"
          echo "POST /api/tournaments with Origin $base -> $status: $(head -c 200 /tmp/post-body.txt)"
          if [[ "$status" != "400" ]]; then
            echo "::error::Same-origin POST through the frontend proxy returned $status, expected 400 (validation)."
            exit 1
          fi
          # The handshake answers 101 and then stays open, so curl ends on its timeout; only the status matters.
          # Sec-WebSocket-Key is a random per-handshake nonce (16 bytes, base64), not a credential.
          ws_key="$(head -c 16 /dev/urandom | base64)"
          ws_status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 3 \
            -H "Origin: $base" -H 'Connection: Upgrade' -H 'Upgrade: websocket' \
            -H 'Sec-WebSocket-Version: 13' -H "Sec-WebSocket-Key: $ws_key" \
            "$base/ws/games" 2>/dev/null || true)"
          echo "WebSocket handshake /ws/games with Origin $base -> $ws_status"
          if [[ "$ws_status" != "101" ]]; then
            echo "::error::Same-origin WebSocket handshake through the frontend proxy returned $ws_status, expected 101."
            exit 1
          fi

      - name: Check that unknown host names are rejected (DNS rebinding)
        # A page on a foreign domain that resolves to 127.0.0.1 sends its own name as Host and a matching
        # Origin. The frontend must refuse such requests before they reach the backend.
        run: |
          base="http://127.0.0.1:${FRONTEND_PORT:-4200}"
          evil="evil.example:${FRONTEND_PORT:-4200}"
          check_rejected() {
            local what="$1" status
            shift
            status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 -H "Host: $evil" "$@" 2>/dev/null || true)"
            echo "$what with Host $evil -> $status"
            if [[ "$status" != "421" ]]; then
              echo "::error::$what with an unknown Host returned $status, expected 421."
              exit 1
            fi
          }
          ws_key="$(head -c 16 /dev/urandom | base64)"
          check_rejected "GET /" "$base/"
          check_rejected "POST /api/tournaments" -X POST -H "Origin: http://$evil" \
            -H 'Content-Type: application/json' --data '{}' "$base/api/tournaments"
          check_rejected "WebSocket handshake /ws/games" -H "Origin: http://$evil" \
            -H 'Connection: Upgrade' -H 'Upgrade: websocket' -H 'Sec-WebSocket-Version: 13' \
            -H "Sec-WebSocket-Key: $ws_key" "$base/ws/games"
          # Absolute-form request line: nginx picks the server by the allowed name in the request line, so the
          # foreign Host header must be caught separately instead of being forwarded to the backend.
          check_rejected "Absolute-form GET http://127.0.0.1/api/tournaments" \
            --request-target "http://127.0.0.1/api/tournaments" "$base/api/tournaments"

      - name: Show logs on failure
        if: failure()
        env:
          IMAGE_NAMESPACE: ${{ needs.validate-tag.outputs.namespace }}
          IMAGE_TAG: ${{ needs.validate-tag.outputs.candidate_tag }}
          OPENROUTER_API_KEY: smoke-test-placeholder
          DB_PASSWORD: unused
        run: docker compose -f docker-compose.prod.yml logs --tail=200

      - name: Stop stack
        if: always()
        env:
          IMAGE_NAMESPACE: ${{ needs.validate-tag.outputs.namespace }}
          IMAGE_TAG: ${{ needs.validate-tag.outputs.candidate_tag }}
          OPENROUTER_API_KEY: smoke-test-placeholder
          DB_PASSWORD: unused
        run: docker compose -f docker-compose.prod.yml down -v

  promote:
    name: Promote Version and Latest Tags
    runs-on: ubuntu-latest
    needs:
      - validate-tag
      - smoke-test
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.validate-tag.outputs.version }}
      BACKEND_IMAGE: ${{ needs.validate-tag.outputs.backend_image }}
      FRONTEND_IMAGE: ${{ needs.validate-tag.outputs.frontend_image }}
      BACKEND_DIGEST: ${{ needs.smoke-test.outputs.backend_digest }}
      FRONTEND_DIGEST: ${{ needs.smoke-test.outputs.frontend_digest }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag verified digests with the release version
        run: |
          # One index source makes imagetools create copy the full index, including both platforms.
          docker buildx imagetools create -t "$BACKEND_IMAGE:$VERSION" "$BACKEND_IMAGE@$BACKEND_DIGEST"
          docker buildx imagetools create -t "$FRONTEND_IMAGE:$VERSION" "$FRONTEND_IMAGE@$FRONTEND_DIGEST"

      - name: Move latest to the verified digests
        run: |
          docker buildx imagetools create -t "$BACKEND_IMAGE:latest" "$BACKEND_IMAGE@$BACKEND_DIGEST"
          docker buildx imagetools create -t "$FRONTEND_IMAGE:latest" "$FRONTEND_IMAGE@$FRONTEND_DIGEST"

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - validate-tag
      - smoke-test
      - promote
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build release notes
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
          BACKEND_IMAGE: ${{ needs.validate-tag.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.validate-tag.outputs.frontend_image }}
          BACKEND_DIGEST: ${{ needs.smoke-test.outputs.backend_digest }}
          FRONTEND_DIGEST: ${{ needs.smoke-test.outputs.frontend_digest }}
        run: |
          python3 scripts/release_notes.py "$VERSION" CHANGELOG.md --repository "$GITHUB_REPOSITORY" > release-notes.md

          # Find the closest reachable release tag, ignoring candidates and prereleases.
          matches=()
          while IFS= read -r tag; do
            if [[ "$tag" != "$VERSION" && "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              matches+=(--match "$tag")
            fi
          done < <(git tag --list 'v*')
          previous_tag=''
          if (( ${#matches[@]} )); then
            previous_tag="$(git describe --tags --abbrev=0 "${matches[@]}" "$VERSION" 2>/dev/null || true)"
          fi

          {
            printf '\n## Verification\n\n'
            printf 'Multi-arch images (linux/amd64 + linux/arm64; index digests verified before promotion):\n'
            printf -- '- `%s:%s` (`%s`)\n' "$BACKEND_IMAGE" "$VERSION" "$BACKEND_DIGEST"
            printf -- '- `%s:%s` (`%s`)\n' "$FRONTEND_IMAGE" "$VERSION" "$FRONTEND_DIGEST"
            printf '\n### Assets\n\n'
            printf -- '- [docker-compose.yml](%s/%s/releases/download/%s/docker-compose.yml): images default to `%s`.\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$VERSION" "$VERSION"
            printf -- '- [env.example](%s/%s/releases/download/%s/env.example): set your OpenRouter key and database password.\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$VERSION"
            if [[ -n "$previous_tag" ]]; then
              printf '\n[Full Changelog](%s/%s/compare/%s...%s)\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$previous_tag" "$VERSION"
            else
              printf '\n[Full Changelog](%s/%s/commits/%s)\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$VERSION"
            fi
          } >> release-notes.md

      - name: Prepare setup assets
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: python3 scripts/release_assets.py "$VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: false
          body_path: release-notes.md
          # Attach at creation: release immutability prevents adding assets later.
          fail_on_unmatched_files: true
          files: |
            release-assets/docker-compose.yml
            release-assets/env.example
