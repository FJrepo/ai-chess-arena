name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    # Release tags reuse this workflow; their commits were already scanned on main.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-tests:
    name: Backend tests (Java 25)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Backend lint (compile)
        run: mvn -B -DskipTests compile

      - name: Backend style check (Checkstyle)
        run: mvn -B -DskipTests checkstyle:check

      - name: Backend format check
        run: mvn -B -DskipTests spotless:check

      - name: Run backend tests
        # verify = unit tests + *IT database tests against a Dev Services PostgreSQL (Docker)
        run: mvn -B verify

  frontend-build:
    name: Frontend build (Node 26)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Frontend lint (ESLint)
        run: npm run lint

      - name: Frontend type check
        run: npm run typecheck

      - name: Frontend format check
        run: npm run format:check

      - name: Run frontend tests
        run: npm test -- --watch=false

      - name: Build frontend (development config)
        run: npm run build -- --configuration development
