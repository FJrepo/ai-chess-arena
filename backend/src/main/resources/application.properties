# OpenRouter
openrouter.api-key=${OPENROUTER_API_KEY:}
openrouter.base-url=https://openrouter.ai/api/v1
openrouter.featured-providers=openai,anthropic,google,x-ai,meta-llama,deepseek,mistralai,qwen,cohere
openrouter.provider-order=openai,anthropic,google,x-ai,meta-llama,deepseek,mistralai,qwen,cohere
openrouter.featured-keywords=gpt,claude,gemini,llama,grok,deepseek,mistral,qwen,command
openrouter.excluded-model-keywords=embedding,embeddings,rerank,moderation,transcription,speech,tts,image,vision,audio,video,search
openrouter.validate-participant-models=true
openrouter.model-validation-fail-open=true
# Upper bound for one model request, also without a move time limit (a provider problem when reached, never a forfeit)
openrouter.request-safety-cap=PT10M

# Stockfish protocol deadlines (positive durations)
stockfish.handshake-timeout=${STOCKFISH_HANDSHAKE_TIMEOUT:PT10S}
stockfish.evaluation-timeout=${STOCKFISH_EVALUATION_TIMEOUT:PT30S}

# Game defaults
game.default-temperature=0.7
game.default-max-tokens=16384

# Database
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true

# Runtime (prod) requires explicit DB credentials.
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:chess_tournament}
%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASSWORD}

# Dev profile convenience defaults (docker compose up -d db).
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:chess_tournament}
%dev.quarkus.datasource.username=${DB_USER:chess}
%dev.quarkus.datasource.password=${DB_PASSWORD:chess}

# Tests: no datasource is configured, so Quarkus Dev Services starts a throwaway PostgreSQL
# container (Docker required). Only the *IT database tests (mvn verify) start Quarkus;
# plain unit tests (mvn test) need no Docker.
%test.quarkus.datasource.devservices.image-name=postgres:17-alpine
%test.openrouter.api-key=integration-tests-do-not-call-openrouter
%test.openrouter.base-url=http://127.0.0.1:9
# Random HTTP port for @QuarkusTest ITs, so mvn verify also works while a dev backend holds 8081.
%test.quarkus.http.test-port=0

# Live updates (WebSocket): small client messages only. Periodic pings keep idle connections open through
# proxies and make broken TCP connections fail; they do not evict a peer that ignores pings.
quarkus.websockets-next.server.max-message-size=4096
quarkus.websockets-next.server.auto-ping-interval=30s
game.websocket.max-connections=256
game.websocket.max-subscriptions-per-window=30

# Server port
quarkus.http.port=${HTTP_PORT:8081}
quarkus.application.version=1.5.0

# CORS (for Angular dev server)
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200,http://localhost
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization
quarkus.http.cors.exposed-headers=Content-Disposition

# Jackson
quarkus.jackson.serialization-inclusion=non-null

# Logging
quarkus.log.level=INFO
quarkus.log.category."dev.aichessarena".level=DEBUG
